{% load static %}
<!-- ============================================================
     SEÇÃO: NAVBAR
     Barra fixa no topo (position: sticky, ver static/css/base.css). O botão
     de menu só aparece no breakpoint mobile; o toggle é feito por
     inicializarMenuMobile() em static/js/interacoes.js.
     ============================================================ -->
<header class="navbar">
  <div class="container">
    <a class="navbar__marca" href="{% url 'nucleo:home' %}">Blog Culinário</a>

    <nav aria-label="Navegação principal">
      {# Sobre entra quando a spec correspondente for implementada. #}
      <ul class="navbar__links" id="menu-principal">
        <li><a href="{% url 'nucleo:home' %}">Início</a></li>
        <li><a href="{% url 'receitas:lista' %}">Receitas</a></li>
      </ul>
    </nav>

    <button
      type="button"
      class="navbar__alternador"
      aria-label="Abrir menu de navegação"
      aria-controls="menu-principal"
      aria-expanded="false"
    >
      ☰
    </button>
  </div>
</header>
<!-- fim: NAVBAR -->
