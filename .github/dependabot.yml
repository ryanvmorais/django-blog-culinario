# Dependabot — consumido pelo GitHub, sem CI próprio. Abre PRs de
# atualização de rotina; separado das security updates (Dependabot alerts,
# ligadas em Settings > Security do repositório).
# Agenda: domingo, 09:00 (America/Sao_Paulo). Cada ecossistema abre um único PR
# agrupado com os bumps minor e patch; um major continua em PR próprio. As
# security updates seguem o ritmo dos alertas e ignoram esta agenda.
version: 2
updates:
  # Dependências Python geridas via uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    # Espera a versão "assentar" antes de propor o bump — reduz o risco de
    # pegar um pacote recém-publicado e ainda malicioso/instável.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions usadas nos workflows de CI em .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
