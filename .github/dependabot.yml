# Dependabot — consumido pelo GitHub, sem CI próprio. Abre PRs de
# atualização de rotina; separado das security updates (Dependabot alerts,
# ligadas em Settings > Security do repositório).
version: 2
updates:
  # Dependências Python geridas via uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Espera a versão "assentar" antes de propor o bump — reduz o risco de
    # pegar um pacote recém-publicado e ainda malicioso/instável.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"

  # Actions usadas nos workflows de CI em .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
